<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — TreeCodex</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#050510;color:#c8d5e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
h1,h2{font-family:'Space Grotesk',sans-serif}
.glow{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.glow-1{background:#1a3a5c;top:-100px;left:-100px;opacity:.15}
.glow-2{background:#1a4a3a;bottom:-100px;right:-100px;opacity:.1}
.container{position:relative;z-index:1;max-width:480px}
.character{width:220px;height:auto;margin-bottom:24px;animation:wobble 3s ease-in-out infinite;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))}
@keyframes wobble{0%,100%{transform:rotate(-2deg) translateY(0)}25%{transform:rotate(1deg) translateY(-8px)}75%{transform:rotate(-1deg) translateY(-4px)}}
.code{font-family:'Space Grotesk',sans-serif;font-size:120px;font-weight:700;background:linear-gradient(135deg,#6BC5AD,#5A9FD4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:8px}
h2{font-size:28px;color:#fff;margin-bottom:12px}
p{font-size:16px;color:rgba(255,255,255,.5);margin-bottom:32px;line-height:1.6}
.speech{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px 24px;margin-bottom:32px;position:relative;font-size:15px;color:rgba(255,255,255,.7);line-height:1.6}
.speech::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);transform:translateX(-50%) rotate(45deg)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,#6BC5AD,#5EBE9A);color:#050510;border:none;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Space Grotesk',sans-serif;transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(107,197,173,.3)}
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="container">
  <img src="characters/Apldeap_Exp4.png" class="character" alt="Apl De Ap worried">
  <div class="code">404</div>
  <div class="speech">
    "Ay nako! This page got lost in the mangroves. Let me take you back to safety!"
  </div>
  <a href="index.html" class="btn">← Take Me Home</a>
</div>
</body>
</html>
